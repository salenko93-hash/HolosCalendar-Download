plugins { id 'com.android.application' }
android {
 namespace 'ua.holoscalendar.redmi'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'ua.holoscalendar.redmi'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  minSdk 26
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
  targetSdk 35
  versionCode 12
  versionName '4.2.0'
  resValue 'string', 'app_version', versionName
 }
 externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Explicit opt-in: real-model device verification needs separately staged weights/audio.
if (providers.gradleProperty('offlineDeviceCheck').isPresent()) {
 android.sourceSets.androidTest.java.srcDir 'src/offlineDeviceTest/java'
}
